<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en AnimeList para gestionar tu lista de anime.">
    <meta name="theme-color" content="#0b0b12">
    <title>AnimeList · Iniciar sesión</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
    <script>
        try {
            var saved = JSON.parse(localStorage.getItem('animelist_settings') || '{}').theme;
            document.documentElement.dataset.theme = saved ||
                (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) { /* tema por defecto */ }
    </script>
</head>
<body class="auth-page">
    <a href="#contenido" class="skip-link">Saltar al contenido principal</a>

    <main id="contenido" class="auth">
        <header class="auth__brand">
            <span class="brand__mark" aria-hidden="true">⛩️</span>
            <h1 class="auth__title">AnimeList</h1>
            <p class="auth__tagline">Tu lista de anime con portadas, notas y estados.</p>
        </header>

        <section class="panel auth__card">
            <h2 class="panel__title">Iniciar sesión</h2>

            <form id="form-login" class="form-stack" novalidate>
                <div class="field">
                    <label for="usuario">Usuario</label>
                    <input id="usuario" name="username" type="text" autocomplete="username"
                           spellcheck="false" placeholder="tu_alias" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password"
                           placeholder="Tu contraseña" required>
                </div>

                <button class="btn btn--primary btn--block" type="submit">Entrar</button>
                <p class="form-status" id="login-status" role="alert" aria-live="polite"></p>
            </form>

            <p class="auth__alt">¿No tienes cuenta? <a href="index.html">Regístrate</a></p>
        </section>
    </main>

    <div class="theme-fab">
        <button id="btn-theme" class="icon-btn" type="button" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true"></span>
            <span class="sr-only">Cambiar tema</span>
        </button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
